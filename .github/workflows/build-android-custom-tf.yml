name: Build BDCC Custom TF Android

on:
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:3.6.2
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot 3.6.2 Android export
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /root/.local/share/godot/templates
          if [ ! -d /root/.local/share/godot/templates/3.6.2.stable ]; then
            cp -a /root/.local/share/godot/export_templates/3.6.2.stable /root/.local/share/godot/templates/3.6.2.stable
          fi
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -storepass android -keystore /root/debug.keystore -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi
          sed -i 's|keystore/debug="C:/godot/debug.keystore"|keystore/debug="/root/debug.keystore"|' export_presets.cfg
          sed -i 's|keystore/release="C:/godot/debug.keystore"|keystore/release="/root/debug.keystore"|' export_presets.cfg
          # Installiert separat vom offiziellen BDCC, damit dessen Spielstaende nicht angetastet werden.
          sed -i 's|package/unique_name="org.rahimew.bdcc"|package/unique_name="org.rahimew.bdcc.directedtf"|' export_presets.cfg

      # Godot 3 may exit too early with --editor --quit, leaving .stex files absent.
      # Keep its editor process alive until the resources declared in *.import exist.
      - name: Import all Godot assets and verify imported textures
        shell: bash
        run: |
          set -euo pipefail
          godot --editor --no-window --path . --verbose > godot-import.log 2>&1 &
          editor_pid=$!
          trap 'kill "$editor_pid" 2>/dev/null || true' EXIT

          python3 - <<'PYIMPORT'
          import re
          import sys
          import time
          from pathlib import Path

          metadata = list(Path('.').rglob('*.import'))
          expected = set()
          for meta in metadata:
              text = meta.read_text(encoding='utf-8', errors='replace')
              for virtual_path in re.findall(r'res://\.import/[^"\s,\]]+', text):
                  expected.add(Path(virtual_path[len('res://'):]))

          if not expected:
              sys.exit('ERROR: No expected imported resources found. Verify repository contents.')

          print(f'Checking {len(expected)} expected imported resources from {len(metadata)} *.import files', flush=True)
          deadline = time.monotonic() + 360
          consecutive_ready = 0
          missing = list(expected)
          while time.monotonic() < deadline:
              missing = [p for p in expected if not p.is_file() or p.stat().st_size == 0]
              if not missing:
                  consecutive_ready += 1
                  if consecutive_ready >= 8:
                      print('Godot asset import complete. All expected files exist.', flush=True)
                      break
              else:
                  consecutive_ready = 0
              if int(deadline - time.monotonic()) % 20 == 0:
                  print(f'Waiting for Godot imports: {len(expected)-len(missing)}/{len(expected)} ready', flush=True)
              time.sleep(1)
          else:
              print(f'ERROR: Asset import incomplete: {len(missing)} missing files', flush=True)
              for missing_file in sorted(missing)[:15]:
                  print(f'  MISSING: {missing_file}', flush=True)
              try:
                  print('--- Last lines from Godot import log ---', flush=True)
                  print('\n'.join(Path('godot-import.log').read_text(errors='replace').splitlines()[-60:]), flush=True)
              except OSError:
                  pass
              sys.exit(1)
          PYIMPORT

          kill "$editor_pid" 2>/dev/null || true
          wait "$editor_pid" || true
          echo 'Godot import stage completed and checked.'

      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --verbose --export-debug "Android" build/android/BDCC_Custom_TF.apk
          test -s build/android/BDCC_Custom_TF.apk

      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BDCC-Custom-TF-Android-APK
          path: build/android/BDCC_Custom_TF.apk
          if-no-files-found: error

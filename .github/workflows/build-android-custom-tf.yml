name: Build BDCC Custom TF Android

on:
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:3.6.2
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot 3.6.2 Android export (templates + SDKs)
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          VERSION=3.6.2.stable
          TEMPLATE_DIR="$HOME/.local/share/godot/templates/$VERSION"
          mkdir -p "$TEMPLATE_DIR" "$HOME/.config/godot"

          # godot-ci stores templates under /root; GitHub Actions changes HOME to /github/home.
          for source_dir in \
            "/root/.local/share/godot/templates/$VERSION" \
            "/root/.local/share/godot/export_templates/$VERSION" \
            "$HOME/.local/share/godot/export_templates/$VERSION"; do
            if [[ -s "$source_dir/android_debug.apk" && -s "$source_dir/android_release.apk" ]]; then
              echo "Using Godot export templates from: $source_dir"
              cp "$source_dir/android_debug.apk" "$TEMPLATE_DIR/android_debug.apk"
              cp "$source_dir/android_release.apk" "$TEMPLATE_DIR/android_release.apk"
              break
            fi
          done
          # godot-ci:3.6.2 has had a reported regression with missing Android templates.
          # Only download the official Godot templates if the container does not contain them.
          if [[ ! -s "$TEMPLATE_DIR/android_debug.apk" || ! -s "$TEMPLATE_DIR/android_release.apk" ]]; then
            echo 'Templates absent in container, fetching official Godot 3.6.2 export templates.'
            wget --tries=3 --timeout=60 -q --show-progress \
              -O /tmp/Godot_v3.6.2-stable_export_templates.tpz \
              https://github.com/godotengine/godot-builds/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz
            unzip -p /tmp/Godot_v3.6.2-stable_export_templates.tpz templates/android_debug.apk > "$TEMPLATE_DIR/android_debug.apk"
            unzip -p /tmp/Godot_v3.6.2-stable_export_templates.tpz templates/android_release.apk > "$TEMPLATE_DIR/android_release.apk"
            rm -f /tmp/Godot_v3.6.2-stable_export_templates.tpz
          fi
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          printf '%s\n' "$VERSION" > "$TEMPLATE_DIR/version.txt"
          echo "Android templates installed in $TEMPLATE_DIR"

          if [[ -n "${JAVA_HOME:-}" && -x "${JAVA_HOME}/bin/jarsigner" ]]; then
            JAVA_SDK="$JAVA_HOME"
          else
            command -v javac >/dev/null || { echo 'ERROR: javac (JDK) missing in container'; exit 1; }
            JAVA_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          test -x "$JAVA_SDK/bin/jarsigner" || { echo "ERROR: jarsigner missing in $JAVA_SDK"; exit 1; }

          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          if [[ ! -x "$ANDROID_SDK/platform-tools/adb" ]]; then
            for possible_sdk in /usr/lib/android-sdk /opt/android-sdk /opt/android-sdk-linux /root/android-sdk; do
              if [[ -x "$possible_sdk/platform-tools/adb" ]]; then ANDROID_SDK="$possible_sdk"; break; fi
            done
          fi
          test -x "$ANDROID_SDK/platform-tools/adb" || { echo "ERROR: Android SDK/adb missing: $ANDROID_SDK"; exit 1; }
          echo "Java SDK: $JAVA_SDK"
          echo "Android SDK: $ANDROID_SDK"

          DEBUG_KEYSTORE="$HOME/debug.keystore"
          if [[ -s /root/debug.keystore ]]; then
            cp /root/debug.keystore "$DEBUG_KEYSTORE"
          else
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -storepass android -keystore "$DEBUG_KEYSTORE" \
              -dname 'CN=Android Debug,O=Android,C=US' -validity 9999
          fi
          test -s "$DEBUG_KEYSTORE"

          # Godot 3 loads per-user editor settings here, NOT in /root.
          SETTINGS="$HOME/.config/godot/editor_settings-3.tres"
          printf '[gd_resource type="EditorSettings" format=2]\n\n[resource]\n' > "$SETTINGS"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_SDK" >> "$SETTINGS"
          printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_SDK" >> "$SETTINGS"
          printf 'export/android/debug_keystore = "%s"\n' "$DEBUG_KEYSTORE" >> "$SETTINGS"
          printf 'export/android/debug_keystore_user = "androiddebugkey"\n' >> "$SETTINGS"
          printf 'export/android/debug_keystore_pass = "android"\n' >> "$SETTINGS"
          cat "$SETTINGS"

          # Keep an independent Android app ID, so the original installed BDCC is unaffected.
          sed -i "s|keystore/debug="C:/godot/debug.keystore"|keystore/debug="$DEBUG_KEYSTORE"|" export_presets.cfg
          sed -i "s|keystore/release="C:/godot/debug.keystore"|keystore/release="$DEBUG_KEYSTORE"|" export_presets.cfg
          sed -i 's|package/unique_name="org.rahimew.bdcc"|package/unique_name="org.rahimew.bdcc.directedtf"|' export_presets.cfg
          echo 'Export environment configured and validated.'

      # Some old tracked *.import files have no corresponding original image.
      # They refer to stale cache output that Godot cannot regenerate.
      # Clean ONLY the checkout workspace; this does not modify the GitHub repository.
      - name: Remove orphaned Godot import descriptors
        shell: bash
        run: |
          set -euo pipefail
          removed=0
          while IFS= read -r -d '' descriptor; do
            source_file="${descriptor%.import}"
            if [[ ! -f "$source_file" ]]; then
              echo "Removing stale import metadata (source file absent): $descriptor"
              rm -- "$descriptor"
              (( removed += 1 ))
            fi
          done < <(find . -type f -name '*.import' -print0)
          echo "Removed $removed orphaned Godot import descriptors."

      # Godot 3 may exit too early with --editor --quit, leaving .stex files absent.
      # Keep its editor process alive until the resources declared in *.import exist.
      - name: Import all Godot assets and verify imported textures
        shell: bash
        run: |
          set -euo pipefail
          godot --editor --no-window --path . --verbose > godot-import.log 2>&1 &
          editor_pid=$!
          trap 'kill "$editor_pid" 2>/dev/null || true' EXIT

          # Check imported files using standard Bash/Awk utilities only.
          # The Godot CI container does not include Python 3.
          mapfile -t expected < <(
            find . -type f -name '*.import' -print0 |
              xargs -0 awk -F '"' '/res:\/\/\.import\// {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^res:\/\/\.import\//) print substr($i, 7)
                }
              }' | sort -u
          )

          if (( ${#expected[@]} == 0 )); then
            echo 'ERROR: No imported resource paths found in *.import files.'
            tail -n 60 godot-import.log || true
            exit 1
          fi

          echo "Checking ${#expected[@]} expected imported assets"
          ready_streak=0
          import_ok=0
          missing=()
          for (( second=0; second<480; second++ )); do
            missing=()
            for f in "${expected[@]}"; do
              [[ -s "$f" ]] || missing+=("$f")
            done

            if (( ${#missing[@]} == 0 )); then
              (( ready_streak += 1 ))
              if (( ready_streak >= 8 )); then
                import_ok=1
                break
              fi
            else
              ready_streak=0
            fi

            if (( second % 20 == 0 )); then
              echo "Waiting for imports: $((${#expected[@]} - ${#missing[@]}))/${#expected[@]} ready (${second}s)"
            fi
            if ! kill -0 "$editor_pid" 2>/dev/null; then
              echo 'ERROR: Godot editor exited before assets finished importing.'
              break
            fi
            sleep 1
          done

          if (( import_ok != 1 )); then
            echo "ERROR: Import incomplete, ${#missing[@]} required files still missing."
            printf '  MISSING: %s\n' "${missing[@]:0:15}"
            echo '--- Last Godot import log lines ---'
            tail -n 60 godot-import.log || true
            exit 1
          fi
          echo 'Asset import verified: all expected files exist.'

          kill "$editor_pid" 2>/dev/null || true
          wait "$editor_pid" || true
          echo 'Godot import stage completed and checked.'

      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --verbose --export-debug "Android" build/android/BDCC_Custom_TF.apk
          test -s build/android/BDCC_Custom_TF.apk

      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BDCC-Custom-TF-Android-APK
          path: build/android/BDCC_Custom_TF.apk
          if-no-files-found: error
